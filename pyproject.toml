[project]
name = "securitylab-ai"
version = "0.1.0"
description = "Bounded, evidence-first access-control verification lab."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.140.7",
    "httpx==0.28.1",
    "mcp==1.26.0",
    "openai-agents==0.23.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "controller*", "target*", "verifier*", "worker*"]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"
